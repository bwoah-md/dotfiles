# =========================================================
# Foot Configuration
# Location: ~/.config/foot/foot.ini
# =========================================================

[main]
# ---------------------------------------------------------
# Font
# ---------------------------------------------------------
font=Annotation Mono:size=11.5

# ---------------------------------------------------------
# Shell
# ---------------------------------------------------------
shell=/run/current-system/sw/bin/zsh

# ---------------------------------------------------------
# Window
# ---------------------------------------------------------

# Padding
pad=25x20

# Initial window size (columns x rows)
initial-window-size-chars=90x30

# DPI aware
dpi-aware=yes

# Copy selection to clipboard (not just primary)
selection-target=clipboard

# Resize in pixels instead of cell steps
resize-by-cells=no

[cursor]
# ---------------------------------------------------------
# Cursor
# ---------------------------------------------------------
style=block
blink=yes

[scrollback]
# ---------------------------------------------------------
# Scrollback
# ---------------------------------------------------------
lines=200000
indicator-position=none

[mouse]
# ---------------------------------------------------------
# Mouse
# ---------------------------------------------------------
hide-when-typing=yes

[bell]
# ---------------------------------------------------------
# Bell (disable everything)
# ---------------------------------------------------------
urgent=no
notify=no

[csd]
# No client-side decorations (compositor handles it)
preferred=none

[url]
# Open URLs with xdg-open
launch=xdg-open ${url}

# ---------------------------------------------------------
# Noctalia Theme (Autogenerated — keep near bottom)
# ---------------------------------------------------------
[main]
include=~/.config/foot/themes/noctalia

[colors-dark]
# Background transparency (set after theme to override)
alpha=0.8
