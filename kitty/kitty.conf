# =========================================================
# Kitty Configuration
# =========================================================

# -----------------------------
# Font
# -----------------------------
font_family      family='Annotation Mono'

# Font size
font_size 11

# -----------------------------
# Shell
# -----------------------------
shell /run/current-system/sw/bin/zsh

# -----------------------------
# Window
# -----------------------------
background_opacity 0.8
background_blur 5
dynamic_background_opacity yes

# Window decorations
hide_window_decorations yes

# Wayland / KDE blur support
linux_display_server wayland

# Padding (x y)
window_padding_width 15 20

# Initial window size
initial_window_width  90c
initial_window_height 30c

# Don't remember/maximize automatically
remember_window_size no

# Hide ugly resize flash
resize_debounce_time 0.1

# Smooth rendering
sync_to_monitor yes

# -----------------------------
# Cursor
# -----------------------------
cursor_shape beam
cursor_blink_interval 0.5

# -----------------------------
# Scrollback
# -----------------------------
scrollback_lines 200000

# -----------------------------
# Scrollbar
# -----------------------------
scrollbar scrolled-and-hovered

# -----------------------------
# Clipboard / Mouse
# -----------------------------
copy_on_select yes
mouse_hide_while_typing yes

# -----------------------------
# Behaviour
# -----------------------------
enable_audio_bell no

# NO confirmation dialog when closing kitty
confirm_os_window_close 0

# -----------------------------
# Symbol Map
# -----------------------------
symbol_map U+e000-U+e00a,U+e0a0-U+e0a2,U+e0a3,U+e0b0-U+e0b3,U+e0b4-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# -----------------------------
# Theme
# -----------------------------
include themes/noctalia.conf
