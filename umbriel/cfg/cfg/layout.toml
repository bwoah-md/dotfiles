# Layout algorithm: "scrolling", "dwindle", or "master".
[layout]
mode = "scrolling"
gap = 6
extent_presets = [0.333, 0.5, 0.667]

[layout.struts]
left = 0
right = 0
top = 0
bottom = 0

[layout.scrolling]
default_extent_fraction = 0.5
center_underfull_strip = true
center_focused = "never"

[layout.dwindle]
# preserve_split = false

[layout.master]
position = "left"
default_width_fraction = 0.55
new_on_top = true
