# ─── Global ───
[[window_rule]]
blur = true
blur_optimized = false
opacity = 1

# ─── Noctalia / Umbriel ───
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size = { width = 0.5, height = 0.7 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size = { width = 0.4, height = 0.5 }
default_position = { x = 32, y = 32, anchor = "center" }

[[window_rule]]
match.app_id = "^xdg-desktop-portal-gtk$"
default_floating = true
default_floating_size = { width = 0.4, height = 0.5 }
default_position = { x = 0, y = 0, anchor = "center" }

# ─── Picture-in-Picture ───
[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_floating_size = { width = 0.25, height = 0.25 }
default_output = "HDMI-A-1"
opacity = 1.0
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_focused = false
focus_on_activate = false
default_pinned = true

# ─── TUI Apps ───
[[window_rule]]
match.app_id = "^(yazi\\.filemanager|btop)$"
default_floating = true
default_floating_size = { width = 0.55, height = 0.55 }

# ─── General Floating ───
[[window_rule]]
match.app_id = "^(Mullvad Browser|Tor Browser|org\\.kde\\.kdeconnect\\.handler|org\\.kde\\.kdeconnect\\.daemon)$"
default_floating = true

# ─── Custom Floating & Sized ───
[[window_rule]]
match.app_id = "^sioyek$"
match.title = "^Select Document$"
default_floating = true
default_floating_size = { width = 0.478, height = 0.533 }

[[window_rule]]
match.app_id = "^org.localsend.localsend_app$"
default_floating = true
default_floating_size = { width = 0.4, height = 0.5 }

[[window_rule]]
match.app_id = "^com\\.obsproject\\.Studio$"
default_floating = true
default_floating_size = { width = 0.55, height = 0.65 }

[[window_rule]]
match.app_id = "^scrcpy$"
opacity = 1.0
default_floating = true
default_floating_size = { width = 0.3, height = 0.9 }

[[window_rule]]
match.app_id = "^nwg-look$"
default_floating = true
default_floating_size = { width = 0.4, height = 0.4 }

[[window_rule]]
match.app_id = "^wlfreerdp$"
opacity = 1.0

[[window_rule]]
match.app_id = "^org\\.kde\\.kdeconnect\\.(app|sms)$"
default_floating = true
default_floating_size = { width = 0.476, height = 0.540 }

[[window_rule]]
match.app_id = "^qt[56]ct$"
default_floating = true
default_floating_size = { width = 0.376, height = 0.638 }

[[window_rule]]
match.title = "^File Archiver$"
default_floating = true
default_floating_size = { width = 0.412, height = 0.507 }

[[window_rule]]
match.title = "^Klassy Settings$"
default_floating = true
default_floating_size = { width = 0.595, height = 0.659 }

# ─── Opaque Floating ───
[[window_rule]]
match.app_id = "^(com\\.interversehq\\.qView|mpv)$"
opacity = 1.0
default_floating = true

# ─── Open Maximized ───
[[window_rule]]
match.app_id = "^(org\\.qutebrowser\\.qutebrowser|equibop|org\\.telegram\\.desktop|dev\\.zed\\.Zed|sonora|zapfast|io\\.github\\.lgse\\.Strata|helium)$"
default_maximize = true

# ─── Browser Floating Popups ───
# Bitwarden
[[window_rule]]
match.title = ".*Bitwarden.*"
default_floating = true
default_floating_size = { width = 0.26, height = 0.47 }
default_position = { x = 0, y = 0, anchor = "center" }

# Firefox Library window (History, Downloads, Bookmarks)
[[window_rule]]
match.title = "^Library$"
default_floating = true
default_floating_size = { width = 0.55, height = 0.6 }
default_position = { x = 0, y = 0, anchor = "center" }
