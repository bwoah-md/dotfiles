[animation]
enabled = true
duration_ms = 195
curve = "cinematic"             # Smoother than "easeout"; custom Bézier curve

[animation.beziers]
cinematic = [0.16, 0.84, 0.24, 1.0]
window_flow = [0.20, 0.75, 0.25, 1.0]
workspace_flow = [0.20, 0.80, 0.24, 1.0]

[animation.springs]
apparition = { damping = 0.70, stiffness = 240 }

[animation.windows_in]
enabled = true
curve = "apparition"
style = "popin"                 # popin, zoom, slide, fade, none
scale = 0.90                    # More subtle pop-in (default is 0.85)
# shader  = "../shaders/.glsl"

# Wobbly windows
# [animation.windows_drag]
# physics = true
# stiffness = 36.0
# damping = 6.5
# coupling = 100.0
# pointer_response = 2.0
# max_displacement_px = 200.0
# settle_after_pause_s = 0.25

[animation.windows_out]
enabled = true
duration_ms = 165
curve = "easeoutcubic"
style = "fade"                  # fade, slide
# shader  = "../shaders/.glsl"

[animation.windows_move]
enabled = true
duration_ms = 195
curve = "window_flow"          # Snappy is another option for window movement
# shader  = "../shaders/.glsl"

[animation.workspaces]
enabled = true
duration_ms = 225
curve = "workspace_flow"
# shader  = "../shaders/.glsl"

[animation.overview]
enabled = true
duration_ms = 280
curve = "cinematic"
workspace_curve = "workspace_flow"
# Previous settings:
#enabled = true
#duration_ms = 200
#curve = "ease"
# shader  = "../shaders/.glsl"

[animation.scratchpad]
enabled = true
duration_ms = 215
curve = "easeinoutcubic"
dim = 0.42                      # 0.0-1.0
blur = false

[animation.border]
enabled = false
duration_ms = 200
curve = "ease"
# shader  = "../shaders/.glsl"

[animation.dim_unfocused]
enabled = false
duration_ms = 200
curve = "ease"
dim = 0.0                       # 0.0-1.0
# shader  = "../shaders/.glsl"

[animation.layers]
enabled = true                  # Turned on for Noctalia shell animations
duration_ms = 175
curve = "easeoutcubic"
# shader  = "../shaders/.glsl"
