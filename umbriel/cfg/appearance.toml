[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 0
corner_radius = 0
drag_opacity = 0.75

[appearance.title_bar]
mode = "off"
height = 26
font = "monospace 10"
button_position = "right"
button_corner_radius = 10
buttons = ["maximize", "close"] # "minimise" removed

[appearance.blur]
enabled = true
optimized = false
passes = 3
radius = 3
noise = 0
saturation = 1.0
brightness = 0.9
contrast = 1

[appearance.shadow]
enabled = true
softness = 30
offset_x = 0
offset_y = 0
