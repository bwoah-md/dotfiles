# ══════════════════════════════════════════════════════════════════════════════
# WINDOW BORDER
# ══════════════════════════════════════════════════════════════════════════════

window.active.border.color: {{colors.primary.default.hex}}
window.inactive.border.color: {{colors.outline.default.hex}}


# ══════════════════════════════════════════════════════════════════════════════
# TOGGLEKEYBINDS STATUS INDICATOR
# ══════════════════════════════════════════════════════════════════════════════

window.active.indicator.toggled-keybind.color: {{colors.error.default.hex}}


# ══════════════════════════════════════════════════════════════════════════════
# WINDOW TITLEBAR BACKGROUND
# ══════════════════════════════════════════════════════════════════════════════

window.active.title.bg.color: {{colors.background.default.hex}}
window.inactive.title.bg.color: {{colors.background.default.hex}}

window.active.label.text.color: {{colors.on_surface.default.hex}}
window.inactive.label.text.color: {{colors.on_surface_variant.default.hex}}
window.label.text.justify: center


# ══════════════════════════════════════════════════════════════════════════════
# WINDOW BUTTON HOVER OVERLAY
# ══════════════════════════════════════════════════════════════════════════════

window.button.hover.bg.color: {{colors.hover.default.hex}}


# ══════════════════════════════════════════════════════════════════════════════
# WINDOW BUTTONS
# ══════════════════════════════════════════════════════════════════════════════

window.active.button.unpressed.image.color: {{colors.on_surface.default.hex}}
window.inactive.button.unpressed.image.color: {{colors.on_surface_variant.default.hex}}


# ══════════════════════════════════════════════════════════════════════════════
# MENU
# ══════════════════════════════════════════════════════════════════════════════

menu.border.color: {{colors.outline.default.hex}}
menu.items.bg.color: {{colors.background.default.hex}}
menu.items.text.color: {{colors.on_surface.default.hex}}
menu.items.active.bg.color: {{colors.primary.default.hex}}
menu.items.active.text.color: {{colors.on_primary.default.hex}}
menu.separator.color: {{colors.outline.default.hex}}
menu.title.bg.color: {{colors.background.default.hex}}
menu.title.text.color: {{colors.on_surface.default.hex}}


# ══════════════════════════════════════════════════════════════════════════════
# ON SCREEN DISPLAY (WINDOW-CYCLE DIALOG)
# ══════════════════════════════════════════════════════════════════════════════

osd.bg.color: {{colors.surface.default.hex}}
osd.border.color: {{colors.primary.default.hex}}
osd.label.text.color: {{colors.on_surface.default.hex}}
osd.window-switcher.preview.border.color: {{colors.outline.default.hex}}


# ══════════════════════════════════════════════════════════════════════════════
# META BUTTONS
# ══════════════════════════════════════════════════════════════════════════════

_meta.btn.close: {{colors.error.default.hex}}
_meta.btn.min: {{colors.secondary.default.hex}}
_meta.btn.max: {{colors.primary.default.hex}}
_meta.btn.inactive: {{colors.surface.default.hex}}
_meta.btn.error_hover: {{colors.error.default.hex}}
