# ============================================================
# MATERIAL OSC CONFIGURATION
# ============================================================
#
# Changes are applied to running mpv instances.
# ============================================================


# ------------------------------------------------------------
# APPEARANCE
# ------------------------------------------------------------

# Automatically determine UI scaling
dpi_scale=auto

# Material green accent
accent_color="#b8bb26"


# ------------------------------------------------------------
# UI / INTERACTION
# ------------------------------------------------------------

# Enable right-click context menu
context_menu=yes

# Enable tooltips
tooltip=yes

# Hide the mini seekbar
show_mini_seekbar=no

# Show screenshot button
screenshot_button=yes

# Show picture-in-picture button
pip_button=yes

# Hide window control buttons
window_controls=no

# Mouse inactivity timeout
mouse_timeout=2

# Don't automatically show OSC when the mouse moves
show_on_mouse_move=no

# Enable single-click actions
single_click_actions_enabled=yes


# ------------------------------------------------------------
# SEEKING
# ------------------------------------------------------------

# Width of the seeking zones as a percentage of the screen
seeking_zone_percentage=15

# Default seek step
seek_step_seconds=5

# Temporary playback speed
temporary_speed=2


# ------------------------------------------------------------
# VOLUME
# ------------------------------------------------------------

# Maximum volume allowed by the OSC
max_volume_percentage=150


# ------------------------------------------------------------
# CHAPTER SKIPPING
# ------------------------------------------------------------

# Ask before skipping detected intro/outro chapters
skip_intro_outro_chapters=ask

# Texts used to detect intro/opening chapters
skip_intro_detection_texts=intro,introduction,opening,op,opening theme

# Texts used to detect outro/ending chapters
skip_outro_detection_texts=outro,ending,end credits,credits,closing,ed


# ------------------------------------------------------------
# VIDEO / DISPLAY
# ------------------------------------------------------------

# Let Material OSC control hardware decoding
force_hwdec=no

# Force display-resample synchronization
force_display_resample=yes

# Force mpv to use a window
force_force_window=yes


# ------------------------------------------------------------
# PLAYLIST
# ------------------------------------------------------------

# Enable directory playlists
directory_playlist=yes

# Sort directory playlists alphabetically
directory_playlist_sort=name


# ------------------------------------------------------------
# YOUTUBE / YOUTUBE-DL
# ------------------------------------------------------------

# Automatically select YouTube quality
youtube_quality=auto


# ------------------------------------------------------------
# SPONSORBLOCK
# ------------------------------------------------------------

# Enable SponsorBlock
sponsorblock_should_use=yes

# SponsorBlock categories:
# sponsor
# selfpromo
# exclusive_access
# interaction
# intro
# outro
# preview
# hook
# music_offtopic
# poi_highlight
# filler

# Automatically skip sponsors
sponsorblock_auto_skip_categories=sponsor

# Categories that should not be skipped automatically
sponsorblock_ignore_categories=interaction,preview,hook,exclusive_access

# Use different colors for SponsorBlock segments
sponsorblock_multicolored_segments=yes

# Show SponsorBlock submission button
sponsorblock_show_submit=yes

# Show SponsorBlock voting controls
sponsorblock_show_voting=yes


# ------------------------------------------------------------
# EMPTY SCREEN / TIME DISPLAY
# ------------------------------------------------------------

# Show Material OSC's empty screen
show_empty_screen=yes

# Don't show remaining time
show_remaining_time=no

# Adjust displayed time according to playback speed
adjust_time_with_speed=yes


# ------------------------------------------------------------
# SUBTITLES
# ------------------------------------------------------------

# Allow adjusting subtitle position through Material OSC
adjust_subtitle_position=yes
