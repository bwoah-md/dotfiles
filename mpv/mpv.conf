# ============================================================
# MPV CONFIGURATION
# ============================================================


# ------------------------------------------------------------
# PERFORMANCE
# ------------------------------------------------------------

profile=high-quality


# ------------------------------------------------------------
# ANIME4K SHADERS
# Optimized shaders for lower-end GPUs: Mode A (Fast)
# ------------------------------------------------------------

glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"


# ------------------------------------------------------------
# GENERAL
# ------------------------------------------------------------

# Don't show the title bar
title-bar=no

# Don't show the on-screen controller (OSC).
# Material OSC controls its own visibility/settings.
osc=no

# Automatically fit the video to 95% of the screen size
autofit=95%

# Save the last playback position when quitting mpv
save-position-on-quit=yes

# Default volume
volume=100

# Forces showing subtitles while seeking
demuxer-mkv-subtitle-preroll=yes

# Dithering method.
# 'auto' is usually the best choice.
dither-depth=auto


# ------------------------------------------------------------
# SCALING
# ------------------------------------------------------------

scale=spline36
dscale=mitchell
cscale=mitchell


# ------------------------------------------------------------
# DEBAND
# ------------------------------------------------------------

# Deband parameters:
#   2:35:20:5   recommended for general anime use
#   3:45:25:15  for older DVD / badly mastered BD / WEB streams
#   4:60:30:30  for very poor streams

# deband=2:35:20:5
# deband-iterations=1
# deband-threshold=35
# deband-range=20
# deband-grain=5

# Note:
# For older/weaker iGPUs, increasing deband-threshold may be
# preferable to increasing deband-iterations.
# Recommended if you absolutely must use 1 iteration:
# deband=1:60:25:30


# ------------------------------------------------------------
# SCREENSHOTS
# ------------------------------------------------------------

# Screenshot output format
screenshot-format=png

# Use the same bit depth as the video
# Set to 'no' to save disk space
screenshot-high-bit-depth=yes

# PNG compression level (1-9)
# Higher values = better compression, more processing time
screenshot-png-compression=1

# Screenshot output directory
screenshot-dir="/home/icy/Pictures/Screenshots"


# ------------------------------------------------------------
# VIDEO OUTPUT / GPU
# ------------------------------------------------------------

# Not too useful on modern hardware.
# 'auto-copy-safe' is a safe option if hardware decoding is enabled.
# Defaults to 'no'.
# hwdec=auto-safe

# Video output driver
# gpu-next is recommended
vo=gpu-next

# Vulkan video backend
gpu-api=vulkan


# ------------------------------------------------------------
# PLAYBACK
# ------------------------------------------------------------

# Don't close mpv when the video ends.
# Shows the final frame instead.
keep-open=yes


# ------------------------------------------------------------
# PLAYLIST / IMAGE HANDLING
# ------------------------------------------------------------

# Automatically create a playlist from filtered input
autocreate-playlist=filter

# Keep images displayed indefinitely
image-display-duration=inf
